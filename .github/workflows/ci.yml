name: Android PR CI

on:
  pull_request:
    branches:
      - dev
      - master
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pr-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out source
        uses: actions/checkout@v7.0.0
        with:
          submodules: recursive

      - name: Set up JDK 17
        uses: actions/setup-java@v5.5.0
        with:
          java-version: "17"
          distribution: temurin
          cache: gradle

      - name: Make Gradle Wrapper executable
        run: chmod +x gradlew

      - name: Install Android NDK 22
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;22.1.7171670" >/dev/null

      - name: Set up Node.js 22
        uses: actions/setup-node@v6.4.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: server/crash-reporter/package-lock.json

      - name: Verify crash reporter Worker
        working-directory: server/crash-reporter
        run: |
          npm ci
          npm test
          npm run check

      - name: Build arm64 development APK
        run: ./gradlew :app:assembleEmulatorDebug
