name: Android PR CI

on:
  pull_request:
    branches:
      - dev
      - master
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pr-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out source
        uses: actions/checkout@v7.0.0
        with:
          submodules: recursive

      - name: Set up JDK 17
        uses: actions/setup-java@v5.5.0
        with:
          java-version: "17"
          distribution: temurin
          cache: gradle

      - name: Make Gradle Wrapper executable
        run: chmod +x gradlew

      - name: Build arm64 development APK
        run: ./gradlew :app:assembleEmulatorDebug
