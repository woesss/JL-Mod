name: Android development CI

on:
  workflow_dispatch:
  push:
    branches:
    - dev

permissions:
  contents: write

concurrency:
  group: development-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:

    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v7.0.0
        with:
          submodules: 'true'
      - name: set up JDK 17
        uses: actions/setup-java@v5.5.0
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Install Android NDK 22
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;22.1.7171670" >/dev/null

      - name: Calculate version suffix
        run:
          echo "VERSION_SUFFIX=$(git show -s --abbrev=7 --format=-%cd-%h --date=format:%y%m%d)" >> $GITHUB_ENV

      - name: Build with Gradle
        run: ./gradlew assembleEmulatorDebug

      - name: GitHub Release
        uses: "marvinpinto/action-automatic-releases@v1.2.1"
        with:
          repo_token: "${{ secrets.GITHUB_TOKEN }}"
          automatic_release_tag: "continuous"
          title: "Development Build"
          files: |
            app/build/outputs/apk/emulator/debug/*.apk

      - name: Upload Artifact (bin)
        uses: actions/upload-artifact@v7.0.1
        with:
          name: "JL-Mod-Plus-development-arm64-v8a"
          path: app/build/outputs/apk/emulator/debug/*.apk
