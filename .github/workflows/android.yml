name: Android CI

on:
  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:
  push:
    branches:
      - master

permissions:
  contents: write

jobs:
  build:

    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4.1.6
        with:
          submodules: 'true'
      - name: set up JDK 17
        uses: actions/setup-java@v4.2.1
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Verify signing secrets
        env:
          ENCODED_KEYSTORE: ${{ secrets.SIGNING_KEY }}
          ENCODED_PROPS: ${{ secrets.KEYSTORE_PROPERTIES }}
        run: |
          if [ -z "$ENCODED_KEYSTORE" ] || [ -z "$ENCODED_PROPS" ]; then
            echo "::error::Release signing is not configured. Add SIGNING_KEY and KEYSTORE_PROPERTIES repository secrets."
            exit 1
          fi

      - name: Decode Keystore
        env:
          ENCODED_KEYSTORE: ${{ secrets.SIGNING_KEY }}
          ENCODED_PROPS: ${{ secrets.KEYSTORE_PROPERTIES }}
        run: |
          printf '%s' "$ENCODED_KEYSTORE" | base64 --decode > keystore.jks
          printf '%s' "$ENCODED_PROPS" | base64 --decode > keystore.properties

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew
      - name: Build with Gradle
        run: ./gradlew assembleEmulatorRelease

      - name: Prepare artifact
        run: |
          mkdir -p artifact/mapping
          mv app/build/outputs/native-debug-symbols/**/* artifact
          mv app/build/outputs/mapping/**/* artifact/mapping
          (cd artifact && zip -r "$OLDPWD/symbols.zip" .)

      - name: Get version
        id: get_version
        run: |
          msg=$(git log -1 --pretty=format:"%s")
          echo "version=${msg#* }" >> $GITHUB_OUTPUT

      - name: Draft GitHub Release
        uses: "marvinpinto/action-automatic-releases@v1.2.1"
        with:
          repo_token: "${{ secrets.GITHUB_TOKEN }}"
          automatic_release_tag: ${{ steps.get_version.outputs.version }}
          draft: true
          files: |
            app/build/outputs/apk/**/*.apk
            symbols.zip

      - name: Upload Artifact (bin)
        uses: actions/upload-artifact@v4.3.3
        with:
          name: "JL-Mod-Plus_${{ steps.get_version.outputs.version }}_arm64-v8a"
          path: app/build/outputs/apk/emulator/release/*.apk

      - name: Upload a Build Artifact (sym)
        uses: actions/upload-artifact@v4.3.3
        with:
          name: "Symbols"
          path: artifact
