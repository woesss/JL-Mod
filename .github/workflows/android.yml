name: Android Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: release

    steps:
      - name: Check out tagged source
        uses: actions/checkout@v4.1.6
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Verify release tag and branch
        id: version
        shell: bash
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          if [[ ! "$tag" =~ ^v([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then
            echo "::error::Release tags must use vMAJOR.MINOR.PATCH."
            exit 1
          fi
          git fetch origin master
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/master; then
            echo "::error::Release tag must point to a commit contained in origin/master."
            exit 1
          fi
          major="${BASH_REMATCH[1]}"
          minor="${BASH_REMATCH[2]}"
          patch="${BASH_REMATCH[3]}"
          version_code=$((major * 1000000 + minor * 1000 + patch))
          if (( version_code <= 0 || version_code > 2100000000 )); then
            echo "::error::Calculated Android versionCode is outside the supported range."
            exit 1
          fi
          echo "name=${tag#v}" >> "$GITHUB_OUTPUT"
          echo "code=$version_code" >> "$GITHUB_OUTPUT"

      - name: Set up JDK 17
        uses: actions/setup-java@v4.2.1
        with:
          java-version: "17"
          distribution: temurin
          cache: gradle

      - name: Verify signing secrets
        env:
          SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
          KEYSTORE_PROPERTIES: ${{ secrets.KEYSTORE_PROPERTIES }}
        run: |
          if [ -z "$SIGNING_KEY" ] || [ -z "$KEYSTORE_PROPERTIES" ]; then
            echo "::error::Add SIGNING_KEY and KEYSTORE_PROPERTIES repository secrets."
            exit 1
          fi

      - name: Decode signing configuration
        env:
          SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
          KEYSTORE_PROPERTIES: ${{ secrets.KEYSTORE_PROPERTIES }}
        run: |
          printf '%s' "$SIGNING_KEY" | base64 --decode > keystore.jks
          printf '%s' "$KEYSTORE_PROPERTIES" | base64 --decode > keystore.properties

      - name: Build signed universal APK
        env:
          VERSION_NAME: ${{ steps.version.outputs.name }}
          VERSION_CODE: ${{ steps.version.outputs.code }}
        run: ./gradlew :app:assembleEmulatorRelease

      - name: Prepare release assets
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release-assets symbols/mapping symbols/native
          cp app/build/outputs/apk/emulator/release/*.apk release-assets/
          if [ -d app/build/outputs/mapping ]; then
            cp -R app/build/outputs/mapping/. symbols/mapping/
          fi
          if [ -d app/build/outputs/native-debug-symbols ]; then
            cp -R app/build/outputs/native-debug-symbols/. symbols/native/
          fi
          (cd symbols && zip -r ../release-assets/symbols.zip .)

      - name: Upload release artifacts
        uses: actions/upload-artifact@v4.3.3
        with:
          name: JL-Mod-Plus-${{ steps.version.outputs.name }}-universal
          path: release-assets/*
          if-no-files-found: error

      - name: Create draft GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" release-assets/* \
            --draft \
            --generate-notes \
            --title "JL-Mod Plus ${{ steps.version.outputs.name }}"
