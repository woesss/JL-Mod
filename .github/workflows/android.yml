name: Android Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

env:
  CRASH_REPORT_URL: https://jl-mod-plus-crash-reporter.h3nb-jl-mod-plus.workers.dev/v1/crash-reports
  CRASH_REPORT_FINGERPRINT: 35:CE:45:EC:69:D8:02:1F:C0:1A:72:BC:83:15:80:5A:E0:F6:EB:C3

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release-build:
    name: Release build
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: release

    steps:
      - name: Check out tagged source
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Verify release tag and branch
        id: version
        shell: bash
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          if [[ ! "$tag" =~ ^v([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then
            echo "::error::Release tags must use vMAJOR.MINOR.PATCH."
            exit 1
          fi
          version_name="$(sed -n 's/^[[:space:]]*versionName[[:space:]]*=[[:space:]]*//p' version.properties | tr -d '\r')"
          if [[ -z "$version_name" || "$tag" != "v${version_name}" ]]; then
            echo "::error::Tag $tag does not match version.properties ($version_name)."
            exit 1
          fi
          git fetch origin master
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/master; then
            echo "::error::Release tag must point to a commit contained in origin/master."
            exit 1
          fi
          echo "name=$version_name" >> "$GITHUB_OUTPUT"

      - name: Set up JDK 17
        uses: actions/setup-java@0f481fcb613427c0f801b606911222b5b6f3083a # v5.5.0
        with:
          java-version: "17"
          distribution: temurin
          cache: gradle

      - name: Make Gradle Wrapper executable
        run: chmod +x gradlew

      - name: Install Android NDK 22
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;22.1.7171670" >/dev/null

      - name: Verify signing secrets
        env:
          SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
          KEYSTORE_PROPERTIES: ${{ secrets.KEYSTORE_PROPERTIES }}
          CRASH_REPORT_TOKEN: ${{ secrets.CRASH_REPORT_TOKEN }}
        run: |
          if [ -z "$SIGNING_KEY" ] || [ -z "$KEYSTORE_PROPERTIES" ] || [ -z "$CRASH_REPORT_TOKEN" ]; then
            echo "::error::Add SIGNING_KEY, KEYSTORE_PROPERTIES, and CRASH_REPORT_TOKEN repository secrets."
            exit 1
          fi

      - name: Decode signing configuration
        env:
          SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
          KEYSTORE_PROPERTIES: ${{ secrets.KEYSTORE_PROPERTIES }}
        run: |
          printf '%s' "$SIGNING_KEY" | base64 --decode > keystore.jks
          printf '%s' "$KEYSTORE_PROPERTIES" | base64 --decode > keystore.properties

      - name: Verify release and crash reporter configuration
        shell: bash
        run: |
          set -euo pipefail
          required_properties=(
            storeFile
            storePassword
            keyAlias
            keyPassword
          )
          for property in "${required_properties[@]}"; do
            if ! grep -Eq "^${property}=.+$" keystore.properties; then
              echo "::error::KEYSTORE_PROPERTIES is missing ${property}."
              exit 1
            fi
          done
          if ! grep -Eq '^storeFile=keystore\.jks$' keystore.properties; then
            echo "::error::The Actions signing storeFile must be keystore.jks."
            exit 1
          fi

      - name: Build signed universal APK
        env:
          CRASH_REPORT_TOKEN: ${{ secrets.CRASH_REPORT_TOKEN }}
        run: ./gradlew :app:assembleEmulatorRelease

      - name: Verify release APK
        shell: bash
        run: |
          set -euo pipefail
          apk_files=(app/build/outputs/apk/emulator/release/*.apk)
          if (( ${#apk_files[@]} != 1 )); then
            echo "::error::Expected exactly one release APK."
            exit 1
          fi
          apk="${apk_files[0]}"
          build_tools="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)"
          "$build_tools/apksigner" verify --verbose "$apk"

          badging="$("$build_tools/aapt" dump badging "$apk")"
          grep -F "package: name='io.github.h3nb.jlmodplus'" <<< "$badging"
          native_code="$(grep '^native-code:' <<< "$badging")"
          for abi in arm64-v8a armeabi-v7a x86 x86_64; do
            if ! grep -Fq "'$abi'" <<< "$native_code"; then
              echo "::error::Release APK is missing $abi."
              exit 1
            fi
          done

          actual_sha1="$("$build_tools/apksigner" verify --print-certs "$apk" |
            sed -n 's/^Signer #1 certificate SHA-1 digest: //p' |
            tr -d ':[:space:]' | tr '[:lower:]' '[:upper:]')"
          expected_sha1="$(tr -d ':' <<< "$CRASH_REPORT_FINGERPRINT" | tr '[:lower:]' '[:upper:]')"
          if [[ "$actual_sha1" != "$expected_sha1" ]]; then
            echo "::error::Release certificate fingerprint does not match CRASH_REPORT_FINGERPRINT."
            exit 1
          fi

      - name: Prepare release assets
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release-assets symbols/mapping symbols/native
          cp app/build/outputs/apk/emulator/release/*.apk release-assets/
          if [ -d app/build/outputs/mapping ]; then
            cp -R app/build/outputs/mapping/. symbols/mapping/
          fi
          if [ -d app/build/outputs/native-debug-symbols ]; then
            cp -R app/build/outputs/native-debug-symbols/. symbols/native/
          fi
          (cd symbols && zip -r ../release-assets/symbols.zip .)

      - name: Upload release artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: JL-Mod-Plus-${{ steps.version.outputs.name }}-universal
          path: release-assets/*
          if-no-files-found: error

      - name: Create draft GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" release-assets/* \
            --draft \
            --generate-notes \
            --title "JL-Mod Plus ${{ steps.version.outputs.name }}"
