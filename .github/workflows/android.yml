name: Android Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

env:
  CRASH_REPORT_URL: https://jl-mod-plus-crash-reporter.h3nb-jl-mod-plus.workers.dev/v1/crash-reports
  CRASH_REPORT_FINGERPRINT: 22:74:A1:72:96:D6:84:14:89:7F:CE:59:C0:B6:EB:3B:BC:3D:03:1B

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: release

    steps:
      - name: Check out tagged source
        uses: actions/checkout@v7.0.0
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Verify release tag and branch
        id: version
        shell: bash
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          if [[ ! "$tag" =~ ^v([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then
            echo "::error::Release tags must use vMAJOR.MINOR.PATCH."
            exit 1
          fi
          git fetch origin master
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/master; then
            echo "::error::Release tag must point to a commit contained in origin/master."
            exit 1
          fi
          major="${BASH_REMATCH[1]}"
          minor="${BASH_REMATCH[2]}"
          patch="${BASH_REMATCH[3]}"
          version_code=$((major * 1000000 + minor * 1000 + patch))
          if (( version_code <= 0 || version_code > 2100000000 )); then
            echo "::error::Calculated Android versionCode is outside the supported range."
            exit 1
          fi
          echo "name=${tag#v}" >> "$GITHUB_OUTPUT"
          echo "code=$version_code" >> "$GITHUB_OUTPUT"

      - name: Set up JDK 17
        uses: actions/setup-java@v5.5.0
        with:
          java-version: "17"
          distribution: temurin
          cache: gradle

      - name: Make Gradle Wrapper executable
        run: chmod +x gradlew

      - name: Install Android NDK 22
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;22.1.7171670" >/dev/null

      - name: Verify signing secrets
        env:
          SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
          KEYSTORE_PROPERTIES: ${{ secrets.KEYSTORE_PROPERTIES }}
          CRASH_REPORT_TOKEN: ${{ secrets.CRASH_REPORT_TOKEN }}
        run: |
          if [ -z "$SIGNING_KEY" ] || [ -z "$KEYSTORE_PROPERTIES" ] || [ -z "$CRASH_REPORT_TOKEN" ]; then
            echo "::error::Add SIGNING_KEY, KEYSTORE_PROPERTIES, and CRASH_REPORT_TOKEN repository secrets."
            exit 1
          fi

      - name: Decode signing configuration
        env:
          SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
          KEYSTORE_PROPERTIES: ${{ secrets.KEYSTORE_PROPERTIES }}
        run: |
          printf '%s' "$SIGNING_KEY" | base64 --decode > keystore.jks
          printf '%s' "$KEYSTORE_PROPERTIES" | base64 --decode > keystore.properties

      - name: Verify release and crash reporter configuration
        shell: bash
        run: |
          set -euo pipefail
          required_properties=(
            storeFile
            storePassword
            keyAlias
            keyPassword
          )
          for property in "${required_properties[@]}"; do
            if ! grep -Eq "^${property}=.+$" keystore.properties; then
              echo "::error::KEYSTORE_PROPERTIES is missing ${property}."
              exit 1
            fi
          done
          if ! grep -Eq '^storeFile=keystore\.jks$' keystore.properties; then
            echo "::error::The Actions signing storeFile must be keystore.jks."
            exit 1
          fi

      - name: Build signed universal APK
        env:
          VERSION_NAME: ${{ steps.version.outputs.name }}
          VERSION_CODE: ${{ steps.version.outputs.code }}
          CRASH_REPORT_TOKEN: ${{ secrets.CRASH_REPORT_TOKEN }}
        run: ./gradlew :app:assembleEmulatorRelease

      - name: Prepare release assets
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release-assets symbols/mapping symbols/native
          cp app/build/outputs/apk/emulator/release/*.apk release-assets/
          if [ -d app/build/outputs/mapping ]; then
            cp -R app/build/outputs/mapping/. symbols/mapping/
          fi
          if [ -d app/build/outputs/native-debug-symbols ]; then
            cp -R app/build/outputs/native-debug-symbols/. symbols/native/
          fi
          (cd symbols && zip -r ../release-assets/symbols.zip .)

      - name: Upload release artifacts
        uses: actions/upload-artifact@v7.0.1
        with:
          name: JL-Mod-Plus-${{ steps.version.outputs.name }}-universal
          path: release-assets/*
          if-no-files-found: error

      - name: Create draft GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" release-assets/* \
            --draft \
            --generate-notes \
            --title "JL-Mod Plus ${{ steps.version.outputs.name }}"
